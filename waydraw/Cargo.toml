[package]
name = "waydraw"
version = "5.0.0-rc-2"
edition = "2024"

[dependencies]
# Macro Crate
waydraw-macros = { version="0.1.0", path="../waydraw-macros" }
# Display
display-info = "0.5"
pinray = "0.2"
# pinray = { git = "https://github.com/prushton2/pinray" }
# UI
iced = { version = "0.14.0", features = ["tokio", "image", "canvas"] }
tokio = { version = "1.53.1", features = ["full"] }
iced_core = "0.14.0"
# System
sysinfo = "0.39"
native-dialog = "0.9"
# Codec / Scaling
openh264 = "0.9"
fast_image_resize = "6.1"
# Serialization
rmp-serde = "1.3"
serde = "1.0"
serde_json = "1.0"
# Networking+
iroh = "1.2"
reqwest = "0.13"
# Other
anyhow = "1.0"
enigo = "0.6"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
constcat = "0.6.1"
