[package]
name = "waydraw"
version = "5.0.0"
edition = "2024"

[dependencies]
waydraw-macros = { version="0.1.0", path="../waydraw-macros" }

display-info = "0.5.9"
pinray = "0.2.5"

iced = { version = "0.14.0", features = ["tokio", "image", "canvas"] }
tokio = { version = "1.53.1", features = ["full"] }
iced_core = "0.14.0"

sysinfo = "0.39.6"
native-dialog = "0.9.7"

openh264 = "0.9.8"
fast_image_resize = "6.1.0"

rmp-serde = "1.3.1"
serde = "1.0.229"
serde_json = "1.0.154"

iroh = "1.2.0"
reqwest = "0.13.5"

anyhow = "1.0.104"
enigo = "0.6.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
