name: Deployment Check
run-name: Deployment check
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master

jobs:
  check-waydraw-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waydraw
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:

    - name: "Checkout"
      uses: actions/checkout@v5

    - name: Install Rust (act only)
      if: ${{ env.ACT }}
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: waydraw

    - name: Install xcap dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

    - run: cargo check
    - run: cargo fmt --check
    - run: cargo clippy -- -D warnings

  check-waydraw-win:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waydraw
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:

    - name: "Checkout"
      uses: actions/checkout@v5

    - name: Install Rust (act only)
      if: ${{ env.ACT }}
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: waydraw

    - name: Install dependencies
      run: |
        rustup target add x86_64-pc-windows-gnu
        sudo apt-get update
        sudo apt-get install -y mingw-w64

    - run: cargo check --target x86_64-pc-windows-gnu
    - run: cargo clippy --target x86_64-pc-windows-gnu -- -D warnings

  check-waydraw-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: waydraw
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:

    - name: "Checkout"
      uses: actions/checkout@v5

    - name: Install Rust (act only)
      if: ${{ env.ACT }}
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: waydraw

    - name: Install dependencies
      run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

    - run: cargo check
    - run: cargo clippy -- -D warnings

  check-keyserver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keyserver
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:

    - name: "Checkout"
      uses: actions/checkout@v5

    - name: Install Rust (act only)
      if: ${{ env.ACT }}
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: keyserver

    - run: cargo check
    - run: cargo fmt --check
    - run: cargo clippy -- -D warnings

  check-macros:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waydraw-macros
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:

    - name: "Checkout"
      uses: actions/checkout@v5

    - name: Install Rust (act only)
      if: ${{ env.ACT }}
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: waydraw-macros

    - run: cargo check
    - run: cargo fmt --check
    - run: cargo clippy -- -D warnings