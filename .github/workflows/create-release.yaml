name: Create Release
run-name: Create Release
on:
  push:
    branches: [master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waydraw
    env:
      CARGO_TERM_COLOR: always
    steps:

    - name: "Checkout"
      uses: actions/checkout@v5

    - name: Install Rust (act only)
      if: ${{ env.ACT }}
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: waydraw
        cache-on-failure: true

    - name: Install xcap dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

    - name: build
      run: cargo build --release

    - uses: actions/upload-artifact@v4
      with:
        name: waydraw-linux
        path: waydraw/target/release/waydraw
        if-no-files-found: error

  build-windows:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waydraw
    env:
      CARGO_TERM_COLOR: always
    steps:

    - name: "Checkout"
      uses: actions/checkout@v5

    - name: Install Rust (act only)
      if: ${{ env.ACT }}
      run: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: waydraw
        cache-on-failure: true

    - name: Install dependencies
      run: |
        rustup target add x86_64-pc-windows-gnu
        sudo apt-get update
        sudo apt-get install -y mingw-w64

    - name: build
      run: |
        LIBSTDCXX=$(x86_64-w64-mingw32-g++ -print-file-name=libstdc++.a)
        test -f "$LIBSTDCXX" || { echo "static libstdc++ not found"; exit 1; }
        export RUSTFLAGS="-L native=$(dirname "$LIBSTDCXX") -lstatic=stdc++ -C link-arg=-static-libgcc -C link-arg=-static"
        cargo build --release --target x86_64-pc-windows-gnu

    - uses: actions/upload-artifact@v4
      with:
        name: waydraw-windows.exe
        path: waydraw/target/x86_64-pc-windows-gnu/release/waydraw.exe
        if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: waydraw
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: "12.3"
    steps:

    - name: "Checkout"
      uses: actions/checkout@v5

    - name: Cache Rust dependencies and build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: waydraw
        cache-on-failure: true

    - name: Install dependencies
      run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

    - name: build
      run: |
        cargo build --release --target aarch64-apple-darwin
        cargo build --release --target x86_64-apple-darwin
        mkdir -p target/universal
        lipo -create \
          target/aarch64-apple-darwin/release/waydraw \
          target/x86_64-apple-darwin/release/waydraw \
          -output target/universal/waydraw-macos
        # lipo invalidates the per-arch ad-hoc signatures; arm64 macOS refuses to run unsigned binaries
        codesign --force --sign - target/universal/waydraw-macos

    - uses: actions/upload-artifact@v4
      with:
        name: waydraw-macos
        path: waydraw/target/universal/waydraw-macos
        if-no-files-found: error

  create-release:
    needs:
      - build-linux
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

    - name: "Checkout"
      uses: actions/checkout@v5

    - name: Determine version
      id: version
      run: |
        version=$(grep -m1 '^version' waydraw/Cargo.toml | cut -d'"' -f2)
        echo "tag=v${version}" >> "$GITHUB_OUTPUT"

    - uses: actions/download-artifact@v4
      with:
        name: waydraw-linux
        path: dist/linux

    - uses: actions/download-artifact@v4
      with:
        name: waydraw-windows.exe
        path: dist/windows

    - uses: actions/download-artifact@v4
      with:
        name: waydraw-macos
        path: dist/macos

    - name: Stage release assets
      run: |
        mkdir -p release
        mv dist/linux/waydraw               release/waydraw-linux
        mv dist/windows/waydraw.exe         release/waydraw-windows.exe
        mv dist/macos/waydraw-macos         release/waydraw-macos
        chmod +x release/waydraw-linux release/waydraw-macos
        ls -l release

    - name: Create Release
      if: ${{ !env.ACT }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Release ${{ steps.version.outputs.tag }}
        generate_release_notes: true
        files: |
          release/waydraw-linux
          release/waydraw-windows.exe
          release/waydraw-macos