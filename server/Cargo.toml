[package]
name = "waydraw-server"
version = "2.3.0"
edition = "2024"

[dependencies]
iroh = "1.1.0"
openh264 = "0.9.8"
tokio = { version = "1.53.1", features = ["full"] }
iced = { version = "0.14.0", features = ["tokio"] }
p2p = { path="../p2p" }

enigo = "0.6.1"
fs_extra = "1.3.0"
pinray = "0.2.4"
image = "0.25.10"
fast_image_resize = { version = "6.1.0", features = ["image"] }
display-info = "0.5.9"